<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexPrep - Physics</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="home">

  <div class="sidebar">
    <h2>NexPrep</h2>
    <div class="nav">
      <p onclick="window.location.href='home.html'">Home</p>
      <p onclick="window.location.href='dashboard.html'">Dashboard</p>
      <p onclick="window.location.href='test.html'">Test</p>
      <p onclick="window.location.href='history.html'">History</p>
      <p onclick="window.location.href='profile.html'">Profile</p>
      <p onclick="logout()">Logout</p>
    </div>
  </div>

  <div class="content">
    <button class="back-btn" onclick="window.location.href='home.html'"><span class="back-icon" aria-hidden="true"></span><span>Back to Home</span></button>
    <h1>Physics</h1>
    <p>Select a chapter to start learning</p>
    <div class="chapters" id="chapters-list">
      <noscript>
        <a href="chapter.html?name=kinematics" class="card">Kinematics</a>
        <a href="chapter.html?name=nlm" class="card">Newton's Laws</a>
        <a href="chapter.html?name=wpe" class="card">Work Power Energy</a>
        <a href="chapter.html?name=rotational" class="card">Rotational Motion</a>
      </noscript>
    </div>
  </div>

</div>

<script src="scripts/auth.js"></script>
<script src="scripts/authGuard.js"></script>
<script src="scripts/chapterNames.js"></script>
<script>
  (function () {
    const container = document.getElementById('chapters-list');
    if (!container) return;
    const chapters = getSubjectChapters('physics');
    container.innerHTML = chapters.map(ch =>
      `<a href="chapter.html?name=${encodeURIComponent(ch.id)}" class="card">${ch.name}</a>`
    ).join('');
  })();
</script>
</body>
</html>
