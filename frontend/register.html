<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexPrep - Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/login.css" />
</head>
<body>
  <div class="brand-panel">
    <div class="logo">NexPrep</div>

    <div class="subject-tags">
      <span class="tag tag-physics">Physics</span>
      <span class="tag tag-chemistry">Chemistry</span>
      <span class="tag tag-maths">Mathematics</span>
    </div>

    <h1 class="brand-heading">
      Start your <span>JEE</span><br />journey with confidence.
    </h1>

    <p class="brand-sub">
      Create an account to track your progress, attempt adaptive tests, and sharpen your preparation.
    </p>
  </div>

  <div class="form-panel" style="position:relative;">
    <div class="form-box">
      <h2 class="form-title">Create your account</h2>
      <p class="form-subtitle">Register to continue your preparation</p>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="nameInput" placeholder="Raj Sharma" />
      </div>

      <div class="input-group">
        <label>Email address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" />
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPasswordInput" placeholder="••••••••" />
      </div>

      <p id="register-message" class="form-message"></p>

      <button id="registerButton" class="btn-primary" onclick="handleRegistration()">Create account</button>

      <p class="register-link">Already have an account? <a href="index.html">Sign in</a></p>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
