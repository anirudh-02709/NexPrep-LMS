<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chapter</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>

<body>

<div class="home">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>NexPrep</h2>

    <div class="nav">
      <p onclick="window.location.href='/home.html'">Home</p>
      <p onclick="window.location.href='/dashboard.html'">Dashboard</p>
      <p onclick="window.location.href='/test.html'">Test</p>
      <p onclick="window.location.href='/history.html'">History</p>
      <p onclick="window.location.href='/profile.html'">Profile</p>
      <p onclick="logout()">Logout</p>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <button class="back-btn" onclick="window.location.href='/home.html'">← Back to Home</button>
    <h1 id="chapter-title">Chapter</h1>
    <div class="card panel-card chapter-progress-card">
      <div class="chapter-progress-header">
        <div>
          <h3 class="card-title">Chapter Completion</h3>
          <p id="chapter-completion-state" class="card-text">Loading completion state...</p>
        </div>
        <button id="chapter-completion-btn" class="btn-primary" type="button">Mark as Completed</button>
      </div>
    </div>
    <div id="videos" class="videos"></div>
  </div>

</div>

<script src="/scripts/auth.js"></script>
<script src="/scripts/authGuard.js"></script>
<script src="/scripts/config.js"></script>
<script src="/scripts/chapterNames.js"></script>
<script src="/scripts/chapter.js"></script>

</body>
</html>
